{% extends 'base.html' %}
{% block title %}Kirish - Quiz Arena{% endblock %}
{% block content %}
<div class="container" style="padding-top:80px;">
  <div class="card">
    <h2 class="text-center" style="margin-bottom:28px;">🔐 Kirish</h2>
    {% if error %}
    <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Username kiriting" autofocus required>
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" name="password" placeholder="Parol kiriting" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;">
        Kirish →
      </button>
    </form>
    <p class="text-center mt-4" style="opacity:0.7;">
      Akkaunt yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'tish</a>
    </p>
  </div>
</div>
{% endblock %}

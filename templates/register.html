{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish - Quiz Arena{% endblock %}
{% block content %}
<div class="container" style="padding-top:80px;">
  <div class="card">
    <h2 class="text-center" style="margin-bottom:28px;">🎉 Ro'yxatdan o'tish</h2>
    {% if error %}
    <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Username tanlang" autofocus required>
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" name="password" placeholder="Kamida 6 ta belgi" required>
      </div>
      <div class="form-group">
        <label>Parolni tasdiqlang</label>
        <input type="password" name="password2" placeholder="Parolni qayta kiriting" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;">
        Ro'yxatdan o'tish →
      </button>
    </form>
    <p class="text-center mt-4" style="opacity:0.7;">
      Allaqachon akkaunting bormi? <a href="{% url 'login' %}">Kirish</a>
    </p>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Quiz Yaratish{% endblock %}
{% block extra_style %}
<style>
.editor-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  min-height: calc(100vh - 100px);
  padding: 20px;
  max-width: 1100px;
  margin: 0 auto;
}
.sidebar {
  background: rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 16px;
  height: fit-content;
  position: sticky;
  top: 80px;
}
.sidebar h3 { margin-bottom: 14px; font-size: 1rem; opacity: 0.8; }
.q-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.q-list-item {
  background: rgba(255,255,255,0.08);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 700;
  transition: all 0.15s;
  position: relative;
}
.q-list-item:hover { background: rgba(255,255,255,0.12); }
.q-list-item.active { border-color: #ffd60a; background: rgba(255,214,10,0.1); }
.q-list-item .q-preview {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 200px;
}
.q-list-item .del-q {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: rgba(226,27,60,0.3); border: none; border-radius: 4px;
  color: white; cursor: pointer; padding: 2px 6px; font-size: 0.75rem;
  display: none;
}
.q-list-item:hover .del-q { display: block; }

.main-editor { display: flex; flex-direction: column; gap: 16px; }
.editor-card {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
}
.name-input {
  width: 100%;
  padding: 14px 18px;
  font-size: 1.3rem;
  font-weight: 800;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: white;
  font-family: 'Montserrat', sans-serif;
}
.name-input:focus { outline: none; border-color: #ffd60a; }
.name-input::placeholder { opacity: 0.35; }

.q-text-area {
  width: 100%; min-height: 80px;
  padding: 14px 18px;
  font-size: 1.1rem; font-weight: 700;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: white;
  font-family: 'Montserrat', sans-serif;
  resize: none;
}
.q-text-area:focus { outline: none; border-color: #ffd60a; }
.q-text-area::placeholder { opacity: 0.35; }

.answers-editor {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;
}
.ans-editor {
  border-radius: 12px;
  padding: 16px;
  display: flex; align-items: center; gap: 10px;
  position: relative;
}
.ans-editor.red    { background: rgba(226,27,60,0.25);  border: 2px solid #e21b3c; }
.ans-editor.blue   { background: rgba(19,104,206,0.25); border: 2px solid #1368ce; }
.ans-editor.yellow { background: rgba(216,158,0,0.25);  border: 2px solid #d89e00; }
.ans-editor.green  { background: rgba(38,137,12,0.25);  border: 2px solid #26890c; }
.ans-editor.correct-ans { ring: 4px solid white; filter: brightness(1.2); }
.ans-shape { font-size: 1.3rem; }
.ans-text-input {
  flex: 1; background: transparent; border: none;
  color: white; font-family: 'Montserrat', sans-serif;
  font-size: 0.95rem; font-weight: 700;
  outline: none;
}
.ans-text-input::placeholder { opacity: 0.4; }
.correct-toggle {
  background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
  border-radius: 6px; color: white; padding: 4px 10px;
  font-size: 0.75rem; font-weight: 700; cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  white-space: nowrap;
  transition: all 0.15s;
}
.correct-toggle.is-correct {
  background: rgba(38,137,12,0.5); border-color: #26890c;
}

.settings-row {
  display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap;
}
.setting-group { display: flex; flex-direction: column; gap: 4px; }
.setting-group label { font-size: 0.8rem; opacity: 0.7; font-weight: 700; }
.setting-select {
  padding: 8px 14px; border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1); color: white;
  font-family: 'Montserrat', sans-serif; font-weight: 700;
}
.setting-select:focus { outline: none; border-color: #ffd60a; }
.setting-select option { background: #46178f; }

.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.save-btn {
  background: #ffd60a; color: #1a1a1a;
  padding: 12px 32px; border-radius: 10px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 900; font-size: 1rem;
  border: none; cursor: pointer;
  transition: all 0.15s;
}
.save-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,214,10,0.4); }
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #26890c; color: white;
  padding: 12px 24px; border-radius: 10px;
  font-weight: 700; font-size: 0.9rem;
  transform: translateY(80px); transition: transform 0.3s;
  z-index: 100;
}
.toast.show { transform: translateY(0); }
</style>
{% endblock %}

{% block content %}
<form id="csrf-form" style="display:none;">{% csrf_token %}</form>

<div style="padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;flex-wrap:wrap;gap:10px;">
  <a href="{% url 'my_quizzes' %}" class="btn btn-secondary">← Orqaga</a>
  <button class="save-btn" onclick="saveQuiz()">💾 Saqlash</button>
</div>

<div class="editor-layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div style="margin-bottom:12px;">
      <label style="font-size:0.8rem;opacity:0.7;font-weight:700;">QUIZ NOMI</label>
      <input type="text" id="quiz-name" class="name-input"
             style="font-size:1rem;margin-top:6px;"
             placeholder="Quiz nomini kiriting...">
    </div>
    <hr class="divider">
    <h3>📝 Savollar</h3>
    <div class="q-list" id="q-list"></div>
    <button class="btn btn-secondary" style="width:100%;" onclick="addQuestion()">
      + Savol Qo'shish
    </button>
  </div>

  <!-- Main Editor -->
  <div class="main-editor" id="main-editor">
    <div style="text-align:center;padding:60px 20px;opacity:0.4;">
      <div style="font-size:3rem;">📝</div>
      <p style="margin-top:12px;">Savol qo'shish uchun "+" tugmasini bosing</p>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ Saqlandi!</div>
{% endblock %}

{% block extra_script %}
<script>
const shapes = ['▲', '◆', '●', '■'];
const colors = ['red', 'blue', 'yellow', 'green'];
let questions = [];
let activeIndex = -1;
let quizId = null;

// Load existing data
{% if quiz_data %}
const existingData = {{ quiz_data|safe }};
quizId = existingData.id;
document.getElementById('quiz-name').value = existingData.name;
existingData.questions.forEach(q => {
  questions.push({
    text: q.text,
    time_limit: q.time_limit,
    points: q.points,
    answers: q.answers.map(a => ({ text: a.text, is_correct: a.is_correct })),
  });
});
if (questions.length > 0) { renderSidebar(); showQuestion(0); }
{% endif %}

function addQuestion() {
  questions.push({
    text: '',
    time_limit: 15,
    points: 1000,
    answers: [
      { text: '', is_correct: false },
      { text: '', is_correct: false },
      { text: '', is_correct: false },
      { text: '', is_correct: false },
    ],
  });
  renderSidebar();
  showQuestion(questions.length - 1);
}

function renderSidebar() {
  const list = document.getElementById('q-list');
  list.innerHTML = '';
  questions.forEach((q, i) => {
    const item = document.createElement('div');
    item.className = 'q-list-item' + (i === activeIndex ? ' active' : '');
    item.innerHTML = `
      <div class="q-preview">${i + 1}. ${q.text || '(bo\'sh savol)'}</div>
      <button class="del-q" onclick="deleteQuestion(event, ${i})">✕</button>`;
    item.onclick = (e) => { if (!e.target.classList.contains('del-q')) showQuestion(i); };
    list.appendChild(item);
  });
}

function deleteQuestion(e, i) {
  e.stopPropagation();
  if (!confirm('Savolni o\'chirmoqchimisiz?')) return;
  questions.splice(i, 1);
  if (activeIndex >= questions.length) activeIndex = questions.length - 1;
  renderSidebar();
  if (questions.length > 0) showQuestion(activeIndex < 0 ? 0 : activeIndex);
  else document.getElementById('main-editor').innerHTML = `
    <div style="text-align:center;padding:60px 20px;opacity:0.4;">
      <div style="font-size:3rem;">📝</div>
      <p style="margin-top:12px;">Savol qo'shish uchun "+" tugmasini bosing</p>
    </div>`;
}

function showQuestion(i) {
  saveCurrentQuestion();
  activeIndex = i;
  const q = questions[i];
  renderSidebar();

  const editor = document.getElementById('main-editor');
  editor.innerHTML = `
    <div class="editor-card">
      <div class="top-bar">
        <h3>Savol ${i + 1}</h3>
        <div class="settings-row" style="margin:0;">
          <div class="setting-group">
            <label>Vaqt</label>
            <select class="setting-select" id="q-time">
              ${[5,10,15,20,30,60].map(t =>
                `<option value="${t}" ${q.time_limit==t?'selected':''}>${t} sek</option>`).join('')}
            </select>
          </div>
          <div class="setting-group">
            <label>Ball</label>
            <select class="setting-select" id="q-points">
              ${[500,1000,2000].map(p =>
                `<option value="${p}" ${q.points==p?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
      <textarea class="q-text-area" id="q-text" placeholder="Savol matnini kiriting...">${q.text}</textarea>
    </div>
    <div class="editor-card">
      <h3 style="margin-bottom:14px;">Javob variantlari <span style="opacity:0.5;font-weight:400;font-size:0.85rem;">(to'g'risini belgilang)</span></h3>
      <div class="answers-editor" id="answers-editor"></div>
    </div>`;

  const answersEl = document.getElementById('answers-editor');
  q.answers.forEach((ans, j) => {
    const div = document.createElement('div');
    div.className = `ans-editor ${colors[j]}`;
    div.id = `ans-${j}`;
    div.innerHTML = `
      <span class="ans-shape">${shapes[j]}</span>
      <input type="text" class="ans-text-input" id="ans-text-${j}"
             value="${ans.text}" placeholder="Javob ${j+1}...">
      <button class="correct-toggle ${ans.is_correct ? 'is-correct' : ''}"
              id="correct-${j}" onclick="toggleCorrect(${j})">
        ${ans.is_correct ? '✓ To\'g\'ri' : 'To\'g\'ri?'}
      </button>`;
    answersEl.appendChild(div);
  });
}

function toggleCorrect(j) {
  const btn = document.getElementById(`correct-${j}`);
  const q = questions[activeIndex];
  q.answers[j].is_correct = !q.answers[j].is_correct;
  btn.textContent = q.answers[j].is_correct ? "✓ To'g'ri" : "To'g'ri?";
  btn.className = 'correct-toggle' + (q.answers[j].is_correct ? ' is-correct' : '');
}

function saveCurrentQuestion() {
  if (activeIndex < 0 || activeIndex >= questions.length) return;
  const q = questions[activeIndex];
  const textEl = document.getElementById('q-text');
  const timeEl = document.getElementById('q-time');
  const ptsEl = document.getElementById('q-points');
  if (textEl) q.text = textEl.value;
  if (timeEl) q.time_limit = parseInt(timeEl.value);
  if (ptsEl) q.points = parseInt(ptsEl.value);
  for (let j = 0; j < 4; j++) {
    const inp = document.getElementById(`ans-text-${j}`);
    if (inp) q.answers[j].text = inp.value;
  }
}

async function saveQuiz() {
  saveCurrentQuestion();
  const name = document.getElementById('quiz-name').value.trim();
  if (!name) { alert("Quiz nomini kiriting!"); return; }
  if (questions.length === 0) { alert("Kamida bitta savol kerak!"); return; }

  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    if (!q.text.trim()) { alert(`${i+1}-savol matni bo'sh!`); return; }
    if (!q.answers.some(a => a.is_correct)) { alert(`${i+1}-savol uchun to'g'ri javob belgilanmagan!`); return; }
  }

  const body = { name, questions, quiz_id: quizId };
  const res = await fetch('/quizzes/save/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.success) {
    quizId = data.quiz_id;
    showToast('✓ Saqlandi!');
  } else {
    alert(data.error || 'Xatolik yuz berdi');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getCookie(name) {
  // Avval hidden form'dan ol
  const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
  if (csrfInput) return csrfInput.value;
  // Yo'q bo'lsa cookie'dan qidir
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    for (let cookie of document.cookie.split(';')) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
{% endblock %}
